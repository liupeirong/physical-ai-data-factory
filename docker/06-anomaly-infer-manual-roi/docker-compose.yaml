# anomaly-infer (manual ROI) — standalone Docker Compose port of the OSMO
# `anomaly-infer / infer-all-defects` task from
#   skills/physical-ai-defect-image-generation/assets/configs/texture_defect_generation_day1_manual_roi.yaml
#
# Runs AnomalyGen inference end-to-end on a single local GPU against a
# **pre-prepared inference dataset** (no usd2roi/augment chain feeding it).
# Suitable for:
#   - usecase=glass         (no USD/real-photo flow exists)
#   - usecase=metal_surface (no USD/real-photo flow exists)
#   - usecase=pcb when the user explicitly skips CAD-to-real-photo alignment
#     and feeds a manually prepared ROI dataset directly
#
# Two operating modes, picked by what is present at INFERENCE_DATASET_DIR:
#
#   Mode A (default): the dir already ships `defect_spec.jsonl` + canonical
#     `<TEXTURE>/{clean_image,cad_mask,mask}/` layout (e.g. the raw artifact
#     produced by the relevant `setup/setup_<case>.yaml`).
#
#   Mode B: flat user upload of clean images + per-defect submasks.
#     run.sh stages them into the canonical layout and renders
#     `defect_spec.jsonl` from ANOMALY_TYPES_JSON at runtime.
#
# Pipeline position:
#   datasets/<usecase>/raw (prepared)  →  anomaly-infer (this)
#
# ── Prerequisites on the Docker host ─────────────────────────────────────────
#   1. NVIDIA driver + NVIDIA Container Toolkit installed (so `--gpus` works).
#   2. A Hugging Face token with access to the gated weights pulled in by
#      anomalygen (Qwen3-VL etc.) — was the OSMO `credentials: hf-token` block.
#   3. Three data trees available on the host:
#        a. INFERENCE_DATASET_DIR — `datasets/<usecase>/raw` tree (clean images
#                                  + per-defect submasks, + optional
#                                  defect_spec.jsonl + semantic_segmentation_labels.json
#                                  at root for Mode A)
#        b. PRETRAINED_DIR        — `models/pretrained` tree (NVDINOV2, sam2,
#                                  Qwen, C-RADIOv2_B.pth, ...)
#        c. CHECKPOINT_DIR        — either the shipped `models/<usecase>`
#                                  checkpoint OR a finetune run output (must
#                                  contain ag_config.yaml + iter_<step>.pt).
#   4. nvcr.io login if your account requires it (paidf-* images are public).
#
# ── Configure via environment (or `source setup.sh` next to this compose) ────
#   INFERENCE_DATASET_DIR       host path to datasets/<usecase>/raw            (REQUIRED)
#   PRETRAINED_DIR              host path to models/pretrained                 (REQUIRED)
#   CHECKPOINT_DIR              host path to models/<usecase> OR finetune out  (REQUIRED)
#   SCRIPTS_DIR                 host path to skills/physical-ai-defect-image-generation/scripts  (REQUIRED)
#   OUTPUT_DIR                  host path where inference outputs are written  (REQUIRED)
#   HF_TOKEN                    Hugging Face token                             (REQUIRED)
#   EXP_NAME                    run identifier (was the OSMO `name` knob)      (default anomaly-${TIMESTAMP})
#   ANOMALY_TYPES_JSON          JSON list of [material, defect] pairs          (per-usecase, see setup.sh)
#   CHECKPOINT_STEP             iter step to load (auto if best-step pickable) (per-usecase, see setup.sh)
#   NUM_SDG                     total SDG entries across all defects           (default 30)
#   DEFAULT_SPATIAL_DEPENDENCY  free|text|cad                                  (default cad)
#   MODEL_SIZE                  AnomalyGen model size                          (default 2b)
#
# ── Run ──────────────────────────────────────────────────────────────────────
#   source setup.sh && docker compose up
#   (add --abort-on-container-exit to stop the moment the job finishes)

services:
  anomaly-infer:
    image: nvcr.io/nvidia/paidf-anomalygen:1.0.0
    # AnomalyGen rank loads the full 2B + tokenizer + DINOv2 + Cosmos-Predict2
    # stack; large /dev/shm avoids torch DataLoader pin-memory failures.
    shm_size: "32gb"
    # OSMO overrides the image ENTRYPOINT; we do the same and drive run.sh.
    entrypoint: ["bash", "/tmp/run.sh"]
    environment:
      # Mirrors the OSMO task `environment:` block plus the GPU capabilities the
      # pod template normally injects.
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      # Was the OSMO `credentials: hf-token -> HF_TOKEN: token` injection.
      HF_TOKEN: "${HF_TOKEN:-}"
      # Replaces OSMO templating ({{ ... }} workflow knobs). Per-usecase
      # ANOMALY_TYPES_JSON / CHECKPOINT_STEP defaults are picked in setup.sh
      # (the OSMO config auto-swaps them via Jinja from PCBA defaults).
      EXP_NAME: "${EXP_NAME:-anomaly-infer-manual-roi}"
      ANOMALY_TYPES_JSON: '${ANOMALY_TYPES_JSON:-[["passive_component","missing"]]}'
      CHECKPOINT_STEP: "${CHECKPOINT_STEP:-14000}"
      NUM_SDG: "${NUM_SDG:-30}"
      DEFAULT_SPATIAL_DEPENDENCY: "${DEFAULT_SPATIAL_DEPENDENCY:-cad}"
      MODEL_SIZE: "${MODEL_SIZE:-2b}"
      # Replaces OSMO templating ({{input:0..2}} / {{output}}).
      INFERENCE_DATASET: /data/inference
      PRETRAINED_SRC_IN: /data/pretrained
      CKPT_DATASET: /data/checkpoint
      OSMO_OUTPUT_ROOT: /data/output
    volumes:
      # datasets/<usecase>/raw (read-only) — was OSMO {{input:0}}; clean images
      # + per-defect submasks (+ optional defect_spec.jsonl + labels JSON for
      # Mode A).
      - "${INFERENCE_DATASET_DIR}:/data/inference:ro"
      # models/pretrained (read-only) — was OSMO {{input:1}}; linked into
      # /workspace/paidf-anomalygen/checkpoints/ for NVDINOV2/sam2/Qwen/etc.
      - "${PRETRAINED_DIR}:/data/pretrained:ro"
      # Checkpoint (read-only) — was OSMO {{input:2}}; either the shipped
      # `models/<usecase>` tree or a finetune run output.
      - "${CHECKPOINT_DIR}:/data/checkpoint:ro"
      # Run output — was the OSMO URL output runs/<name>/anomaly. run.sh nests
      # the actual SDG output under <OUTPUT_DIR>/inference/ so the daft-format
      # sibling path lands inside the writable mount.
      - "${OUTPUT_DIR}:/data/output"
      # Helper scripts — were OSMO `files: localpath` mounts.
      - "${SCRIPTS_DIR}/render_defect_spec.py:/tmp/render_defect_spec.py:ro"
      - "${SCRIPTS_DIR}/pick_best_step.sh:/tmp/pick_best_step.sh:ro"
      # Env-driven port of the OSMO inline run_infer.sh (lives next to this compose).
      - "./run.sh:/tmp/run.sh:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
