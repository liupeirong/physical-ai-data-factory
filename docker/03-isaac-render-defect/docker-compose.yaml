# isaac-render-defect — standalone Docker Compose port of the OSMO
# `isaac-render-defect / sdg-and-crop` task from
#   skills/physical-ai-defect-image-generation/assets/configs/structural_defect_generation.yaml
#
# Runs Stage 1 (Kit + sdg_pipeline.py pipeline_type=defect — pose-defect render)
# + Stage 2 (crop_components.py per-component crop) on a single local GPU instead
# of an OSMO task / Kubernetes pod. The downstream `augment-image-edit` stage is
# NOT included here — this only produces the structural_defect render+crop bundle
# (trigger_NNNN/ + cropped/<mode>/{rgb,semantic_segmentation,component_instance}/).
#
# ── Prerequisites on the Docker host ─────────────────────────────────────────
#   1. NVIDIA driver + NVIDIA Container Toolkit installed (so `--gpus` works).
#   2. The OptiX denoiser binary present on the host, default
#      /usr/share/nvidia/nvoptix.bin (installed with the NVIDIA driver). Kit
#      silently degrades to noisy raw path tracing without it.
#   3. The USD asset tree available on the host (the `datasets/pcb/assets`
#      bundle). Point INPUT_ASSETS_DIR at it.
#   4. nvcr.io login if your account requires it (paidf-* images are public).
#
# ── Configure via environment (or `source setup.sh` next to this compose) ────
#   INPUT_ASSETS_DIR  host path to the USD asset tree            (REQUIRED)
#   OUTPUT_DIR        host path where outputs are written         (REQUIRED)
#   COOKBOOKS_DIR     host path to assets/cookbooks               (REQUIRED)
#   BOARD             per-board cookbook dir under cookbooks/pcb (default 0603_H100)
#   NVOPTIX_BIN       host path to nvoptix.bin                   (default /usr/share/nvidia/nvoptix.bin)
#   SCENE_FILENAME    USD basename to use as the scene           (default spark_lighting.usd)
#   MAX_IMAGE_COUNT   Stage-1 render_patches cap (-1 = full)     (default 5)
#   DEFECT_MODES      comma-separated subset of {shift,tombstone,sideflip} or "all" (default all)
#   CROP_OFFSET       Stage-2 per-component crop offset px       (default 10)
#
# ── Run ──────────────────────────────────────────────────────────────────────
#   source setup.sh && docker compose up
#   (add --abort-on-container-exit to stop the moment the job finishes)

services:
  isaac-render-defect:
    image: nvcr.io/nvidia/paidf-simulation:1.0.0
    # Kit ray-tracer buffers need a large /dev/shm (>= 16 GiB, 32 preferred).
    shm_size: "32gb"
    # OSMO overrides the image ENTRYPOINT; we do the same and drive run.sh.
    # Override (not append to) the image's own ENTRYPOINT so run.sh is the actual
    # entrypoint instead of being passed as an argument to the image entrypoint.
    entrypoint: ["bash", "/tmp/run.sh"]
    environment:
      # Mirrors the OSMO task `environment:` block plus the GPU capabilities the
      # pod template normally injects.
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      MAX_IMAGE_COUNT: "${MAX_IMAGE_COUNT:-5}"
      DEFECT_MODES: "${DEFECT_MODES:-all}"
      CROP_OFFSET: "${CROP_OFFSET:-10}"
      # Replaces OSMO templating ({{input:0}} / {{output}} / {{ scene_filename }}).
      ASSETS_IN: /data/assets
      FINAL_OUT: /data/output
      SCENE_FILENAME: "${SCENE_FILENAME:-spark_lighting.usd}"
    volumes:
      # USD asset tree (read-only) — was the OSMO URL input {{input:0}}.
      - "${INPUT_ASSETS_DIR}:/data/assets:ro"
      # Run output — was the OSMO URL output runs/<name>/structural_defect.
      - "${OUTPUT_DIR}:/data/output"
      # OptiX denoiser binary — was the pod-template hostPath mount.
      - "${NVOPTIX_BIN:-/usr/share/nvidia/nvoptix.bin}:/usr/share/nvidia/nvoptix.bin:ro"
      # Per-board cookbooks — were OSMO `files: localpath` mounts.
      - "${COOKBOOKS_DIR}/pcb/${BOARD:-0603_H100}/pcba_target.yaml:/tmp/pcba_target.yaml:ro"
      - "${COOKBOOKS_DIR}/pcb/${BOARD:-0603_H100}/defect_image.yaml:/tmp/render_config.yaml:ro"
      # Env-driven port of the OSMO inline run_render.sh (lives next to this compose).
      - "./run.sh:/tmp/run.sh:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
